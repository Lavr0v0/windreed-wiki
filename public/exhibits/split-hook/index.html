<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d7d1c9">
  <title>右臂分钩义手 · 风芦旅人</title>
  <meta name="description" content="可自由旋转、缩放的右臂分钩义手模型。">
  <meta property="og:title" content="右臂分钩义手">
  <meta property="og:image" content="https://windreed.wiki/exhibits/split-hook/study.webp">
  <link rel="canonical" href="https://windreed.wiki/exhibits/split-hook/">
  <link rel="icon" href="/brand/final/windreed-logo-favicon.svg">
  <base href="/exhibits/split-hook/">
  <link rel="stylesheet" href="./gallery.css?v=2">
  <script type="module" src="./gallery.js?v=2"></script>
</head>
<body>
  <main id="studio" aria-label="右臂分钩义手三维展示">
    <picture id="still">
      <source media="(max-aspect-ratio: 4/5)" srcset="./portrait.webp?v=2">
      <img src="./study.webp?v=2" alt="两条皮悬带连接带有红铜扣的皮箍和承筒，木栖杠沿铁杆伸向两枚赤色弯钩。">
    </picture>
    <model-viewer id="object"
      alt="右臂分钩义手。拖动或使用方向键旋转，滚轮或双指缩放。"
      camera-controls touch-action="none" interaction-prompt="none"
      loading="eager" reveal="auto" camera-target="0.154m 0.036m 0.003m"
      camera-orbit="29deg 62deg 1.17m" min-camera-orbit="auto 0deg 0.08m"
      max-camera-orbit="auto 180deg 2.1m" field-of-view="16deg" min-field-of-view="10deg" max-field-of-view="40deg"
      environment-image="./studio.hdr" tone-mapping="aces" exposure="0.56"
      shadow-intensity="0.48" shadow-softness="0.92">
      <span slot="progress-bar" aria-hidden="true"></span>
    </model-viewer>
  </main>
</body>
</html>
